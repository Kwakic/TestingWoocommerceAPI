# ============================================================================
# docker-compose.wp.yml
# WooCommerce test stack: MySQL + WordPress + WP-CLI
#
# No `container_name:` on any service, on purpose. Docker enforces
# container-name uniqueness ENGINE-WIDE, not per Compose project — so a
# fixed name like "wc-db" can collide with a completely unrelated project
# on the same machine that happens to use the same name, and there's no
# way to tell the two apart. A naive fix (force-removing a container by
# that fixed name before `up`) would nuke that *other* project's
# container too, which is worse than the original problem.
#
# Without `container_name:`, Compose names each container
# <project>-<service>-<index> (e.g. wc-testing-woocommerce-api-db-1),
# scoped to the project below — so collisions with anything outside this
# project are structurally impossible instead of something to defend
# against.
#
# `name:` pins that project name so it stays stable regardless of which
# folder path this file is run from (a fresh clone, a CI runner's
# checkout dir, etc.) — `up` and `down` always agree on what they own.
#
# Consequence: anything that used to reach into a container by its fixed
# name (`docker exec wc-wp ...`) now has to go through Compose instead
# (`docker compose exec -T wordpress ...`) — see scripts/setup.sh.
# ============================================================================
name: wc-testing-woocommerce-api

services:

  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password --ssl=0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp

    ports:
      - "3306:3306"   # 🔥 REQUIRED for CI (host → container DB)

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


  wordpress:
    image: wordpress:6.8-php8.2-apache
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      # This stack is plain HTTP (no SSL). WordPress core only allows
      # Application Passwords on sites using SSL OR sites whose
      # environment type is explicitly "local":
      #   wp_is_application_passwords_supported() = is_ssl() || 'local' === wp_get_environment_type()
      # Without this, a valid Application Password is silently ignored
      # over Basic Auth and the request is treated as anonymous.
      WP_ENVIRONMENT_TYPE: local

    ports:
      - "8080:80"   # 🔥 API exposed to CI

    volumes:
      # ⚠️ BIND MOUNT, not a named volume. `docker compose down -v` only
      # removes named/anonymous Docker volumes — it will NOT clear this
      # folder. For a truly clean reset you also need: rm -rf wp-data
      # (the Makefile's `make clean` target does this for you).
      - ./wp-data:/var/www/html   # ✅ CRITICAL (persistent WP state)

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  wpcli:
    image: wordpress:cli

    depends_on:
      - wordpress

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WP_ENVIRONMENT_TYPE: local   # ✅ keep in sync with wordpress

    volumes:
      - ./wp-data:/var/www/html   # ✅ MUST match wordpress
