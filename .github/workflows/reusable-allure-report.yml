
name: Reusable Allure Report
# Controls: CI execution logic ONLY

# ==================================================
# 🔁 Reusable workflow entrypoint
# ==================================================
on:
  workflow_call:

    # --------------------------------------------------
    # 🔧 Inputs configurable by caller workflows
    # --------------------------------------------------
    inputs:

      suite_name:
        required: true
        type: string

      report_timeout_minutes:
        required: false
        type: number
        default: 10

      entity:
        required: false
        type: string
        default: ""

      # --------------------------------------------------
      # Optional CI metadata.
      #
      # Reserved for future ownership reporting,
      # deployment gates and notifications.
      # --------------------------------------------------
      team:
        required: false
        type: string
        default: ""

      tier:
        required: false
        type: string
        default: ""


permissions:
  contents: read

jobs:

  # ==================================================
  # 📊 JOB — GENERATE + PUBLISH ALLURE REPORT
  # ==================================================

  # --------------------------------------------------
  # 📊 Generate a single Allure report
  #
  # Each matrix entry publishes its own report.
  #
  # Example:
  #
  # Publish Report • customers
  # --------------------------------------------------
  publish-report:
    name: >-
      ${{ inputs.suite_name == 'ui'
          && 'Publish Report • UI'
          || format('Publish Report • {0}', inputs.entity) }}

    # --------------------------------------------------
    # Always run even if previous jobs failed
    # --------------------------------------------------
    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.report_timeout_minutes }}

    # --------------------------------------------------
    # Required to read source code and restore Allure history
    # --------------------------------------------------
    # Permissions
    #
    # contents: read
    #   Required only to checkout the gh-pages branch
    #   and restore Allure history.
    #
    # This workflow never publishes to GitHub Pages.
    # Deployment is delegated to dashboard-publisher.yml.
    # --------------------------------------------------
    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --------------------------------------------------
      # 2. Download Allure raw results
      # --------------------------------------------------
      # API entity suite:
      #   customers-smoke-allure-results
      #
      # UI browser matrix:
      #   ui-chromium-allure-results
      #   ui-firefox-allure-results
      #   ui-webkit-allure-results
      #
      # UI uses a pattern and merge-multiple=true so all
      # browser result sets are combined into one Allure
      # results directory before report generation.
      #
      # Missing artifacts are tolerated because an entity
      # or browser may legitimately have no eligible tests.
      # --------------------------------------------------

      # UI is a browser matrix, so download and merge all
      # browser-specific result artifacts into one directory.
      - name: Download UI Allure results
        id: download_ui_allure
        if: inputs.suite_name == 'ui'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-*-allure-results
          path: reports/allure-results
          merge-multiple: true

      # API/shared suites keep the original exact artifact
      # naming convention. Only the UI suite uses a pattern.
      - name: Download API Allure results
        id: download_api_allure
        if: inputs.suite_name != 'ui'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ format('{0}-{1}-allure-results', inputs.entity, inputs.suite_name) }}
          path: reports/allure-results

      - name: Validate report path inputs
        shell: bash
        env:
          SUITE_NAME: ${{ inputs.suite_name }}
          ENTITY_NAME: ${{ inputs.entity }}
        run: |
          set -euo pipefail

          case "$SUITE_NAME" in
            smoke|integration|regression|performance|ui) ;;
            *) echo "Unsupported report suite: $SUITE_NAME"; exit 1 ;;
          esac

          if [[ "$SUITE_NAME" != "ui" ]]; then
            if [[ ! "$ENTITY_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Invalid report entity: $ENTITY_NAME"
              exit 1
            fi
          fi

      # --------------------------------------------------
      # 2a.Detect whether Allure results exist
      #
      # Some entities may not yet contain active tests.
      #
      # Example:
      # - customers -> report generated
      # - orders    -> skipped
      # - products  -> skipped
      # - coupons   -> skipped
      #
      # Missing Allure results are NOT considered
      # a CI failure.
      # --------------------------------------------------
      - name: Check Allure results
        id: allure_check
        shell: bash
        env:
          SUITE_NAME: ${{ inputs.suite_name }}
          ENTITY_NAME: ${{ inputs.entity }}
        run: |

          if [ ! -d "reports/allure-results" ] || [ -z "$(ls -A reports/allure-results 2>/dev/null)" ]; then

            echo "HAS_ALLURE_RESULTS=false" >> "$GITHUB_ENV"

            echo "## Report Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$SUITE_NAME" = "ui" ]; then
              echo "- Scope: UI / Playwright" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Entity: $ENTITY_NAME" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- Status: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: No Allure results artifact found" >> "$GITHUB_STEP_SUMMARY"

          else

            echo "HAS_ALLURE_RESULTS=true" >> "$GITHUB_ENV"

          fi

      # --------------------------------------------------
      # 3. Checkout gh-pages branch
      #
      # Used for Allure history/trend preservation
      # --------------------------------------------------
      - name: Checkout gh-pages branch
        if: env.HAS_ALLURE_RESULTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      # --------------------------------------------------
      # 4. Restore Allure history
      #
      # Enables historical trend charts
      # across CI runs.
      # --------------------------------------------------
      - name: Restore Allure history
        if: env.HAS_ALLURE_RESULTS == 'true'
        env:
          SUITE_NAME: ${{ inputs.suite_name }}
          ENTITY_NAME: ${{ inputs.entity }}
        run: |
          mkdir -p reports/allure-results/history

          if [ "$SUITE_NAME" = "ui" ]; then
            HISTORY_PATH="gh-pages/ui/history"
          else
            HISTORY_PATH="gh-pages/$ENTITY_NAME/$SUITE_NAME/history"
          fi

          if [ -d "$HISTORY_PATH" ]; then
            cp -r "$HISTORY_PATH"/* \
                  reports/allure-results/history/
            echo "✅ Allure history restored from $HISTORY_PATH"
          else
            echo "ℹ️ No previous Allure history found"
          fi

      # --------------------------------------------------
      # 5. Setup Java
      #
      # Required for Allure CLI
      # --------------------------------------------------
      - name: Setup Java
        if: env.HAS_ALLURE_RESULTS == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Install Allure CLI
      # --------------------------------------------------
      - name: Install Allure
        if: env.HAS_ALLURE_RESULTS == 'true'
        run: |
          curl -L -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip

          unzip -q allure.zip

          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH

      # --------------------------------------------------
      # 7. Generate Allure HTML report
      # --------------------------------------------------
      - name: Generate Allure report
        if: env.HAS_ALLURE_RESULTS == 'true'
        env:
          SUITE_NAME: ${{ inputs.suite_name }}
          ENTITY_NAME: ${{ inputs.entity }}
        run: |
          if [ "$SUITE_NAME" = "ui" ]; then
            REPORT_PATH="reports/allure-report/ui"
          else
            REPORT_PATH="reports/allure-report/$ENTITY_NAME/$SUITE_NAME"
          fi

          allure generate reports/allure-results \
            -o "$REPORT_PATH" \
            --clean

      # --------------------------------------------------
      # 8. Upload generated HTML report
      # --------------------------------------------------
      - name: Publish report artifact
        if: env.HAS_ALLURE_RESULTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.suite_name == 'ui'
            && 'report-ui'
            || format('report-{0}-{1}', inputs.entity, inputs.suite_name) }}
          # --------------------------------------------------
          # Upload only the generated report for this
          # entity/suite.
          #
          # Example:
          #
          # reports/allure-report/
          # └── customers/
          #     └── smoke/
          #
          # becomes artifact:
          #
          # report-customers-smoke
          # --------------------------------------------------
          path: ${{ inputs.suite_name == 'ui'
            && 'reports/allure-report/ui'
            || format('reports/allure-report/{0}/{1}', inputs.entity, inputs.suite_name) }}
          if-no-files-found: warn
          retention-days: 30
