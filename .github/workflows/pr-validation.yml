name: Pull Request Validation

# This workflow is the single aggregation point for mandatory PR validation.
# During migration, the existing Smoke, Integration, and Preflight PR triggers
# remain active until this workflow is verified and branch protection is moved.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  discover-entities:
    name: Discover framework entities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install framework
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e "./EcommerceAPI[dev]"

      - id: discovery
        name: Build entity matrix
        shell: bash
        run: |
          set -euo pipefail
          MATRIX=$(python .github/scripts/generate_matrix.py)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  # Unit and Preflight are deliberately independent so both diagnostics are
  # available even when either suite fails.
  unit:
    name: Unit tests
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      scope: shared
      suite_name: unit
      pytest_markers: "unit and pr"
      timeout_minutes: 5
      pytest_durations: 5
      pytest_maxfail: "1"
      pytest_extra_args: "-v"
      fail_on_empty: true
      setup_woocommerce: false

  preflight:
    name: Preflight checks
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      scope: shared
      suite_name: preflight
      pytest_markers: "preflight and pr"
      timeout_minutes: 5
      pytest_durations: 5
      pytest_maxfail: "1"
      pytest_extra_args: "-v"
      fail_on_empty: true
      setup_woocommerce: false

  smoke:
    name: Smoke • ${{ matrix.entity }}
    needs: discover-entities
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      suite_name: smoke
      pytest_markers: "smoke and pr"
      timeout_minutes: 20
      pytest_durations: 10
      pytest_maxfail: 3
      fail_on_empty: true
      entity: ${{ matrix.entity }}
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}

  shared-smoke:
    name: Shared Smoke
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      scope: shared
      suite_name: smoke
      pytest_markers: "smoke and pr"
      timeout_minutes: 10
      pytest_durations: 5
      pytest_maxfail: 1
      fail_on_empty: true

  integration:
    name: Integration • ${{ matrix.entity }}
    needs: discover-entities
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}
    uses: ./.github/workflows/reusable-test-runner.yml
    with:
      suite_name: integration
      pytest_markers: "integration and pr and not smoke"
      timeout_minutes: 25
      pytest_durations: 20
      pytest_maxfail: 5
      pytest_extra_args: "-v"
      fail_on_empty: true
      entity: ${{ matrix.entity }}
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}

  # Reports run after test failures as long as entity discovery succeeded.
  # They are not dependencies of the required PR Quality Gate.
  smoke-report:
    name: Smoke Report • ${{ matrix.entity }}
    needs:
      - discover-entities
      - smoke
    if: always() && needs.discover-entities.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-allure-report.yml
    with:
      suite_name: smoke
      report_timeout_minutes: 10
      entity: ${{ matrix.entity }}
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}

  integration-report:
    name: Integration Report • ${{ matrix.entity }}
    needs:
      - discover-entities
      - integration
    if: always() && needs.discover-entities.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-allure-report.yml
    with:
      suite_name: integration
      report_timeout_minutes: 10
      entity: ${{ matrix.entity }}
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}

  pr-quality-gate:
    name: PR Quality Gate
    needs:
      - discover-entities
      - unit
      - preflight
      - smoke
      - shared-smoke
      - integration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every mandatory PR suite to succeed
        env:
          DISCOVERY_RESULT: ${{ needs.discover-entities.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SHARED_SMOKE_RESULT: ${{ needs.shared-smoke.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          for result in \
            "entity discovery=$DISCOVERY_RESULT" \
            "unit=$UNIT_RESULT" \
            "preflight=$PREFLIGHT_RESULT" \
            "smoke matrix=$SMOKE_RESULT" \
            "shared smoke=$SHARED_SMOKE_RESULT" \
            "integration matrix=$INTEGRATION_RESULT"; do
            name="${result%%=*}"
            status="${result#*=}"
            if [[ "$status" != "success" ]]; then
              echo "❌ $name result was $status (expected success)."
              failed=1
            else
              echo "✅ $name passed."
            fi
          done

          exit "$failed"
