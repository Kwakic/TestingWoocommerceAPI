name: Contract Tests 📋
# Controls:
# orchestration
# dependencies
# permissions
# triggers

# ==================================================
# The philosophy:
#
# Contract tests validate API contracts and
# response schemas independently for every
# discovered framework entity.
#
# Results are kept as CI artifacts for
# diagnostics and schema evolution analysis.
# ==================================================


# ==================================================
# 🔁 Triggers
# ==================================================

on:
  # --------------------------------------------------
  # Run on pull requests targeting main branch
  # --------------------------------------------------
  pull_request:
    branches: [ main ]

  # --------------------------------------------------
  # Run on pushes to main branch
  # --------------------------------------------------
  push:
    branches: [ main ]


  # --------------------------------------------------
  # Allow manual execution from GitHub UI
  # --------------------------------------------------
  workflow_dispatch:


jobs:

  # ==================================================
  # 🧪 JOB 1 — EXECUTE CONTRACT TESTS
  # ==================================================
  # Delegates all shared CI logic to the reusable test runner workflow.
  #
  # Shared responsibilities extracted:
  # - checkout
  # - python setup
  # - dependency install
  # - docker startup
  # - MySQL readiness
  # - WooCommerce bootstrap
  # - env configuration
  # - pytest execution
  # - artifact uploads
  # - docker cleanup
  # ==================================================
  test:

    uses: ./.github/workflows/reusable-test-runner.yml

    with:
      scope: shared
      suite_name: contract
      pytest_markers: contract  # Execute only contract validation tests.
      timeout_minutes: 15
      pytest_durations: 10

  # ==================================================
  # 🚦 JOB 2 — CONTRACT QUALITY GATE
  # ==================================================
  #
  # Provides a stable PR status check.
  #
  # Branch protection should require:
  #   Contract Quality Gate
  #
  # The implementation of the contract suite can evolve
  # without changing the protected status check.

  # GitHub branch protection only cares about Contract Quality Gate, not the individual entities.
  # So you'll get for Contract Tests
  # Contract Tests
  # ├── Test • customers
  # │
  # └── Contract Quality Gate

  # Even though there is only one underlying test job today
  # ==================================================

  contract-gate:

    name: Contract Quality Gate

    needs:
      - test

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Validate contract results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Contract tests failed."
            exit 1
          fi

          echo "Contract tests passed."
