name: Reusable Test Runner

# ==================================================
# 🔁 Reusable workflow entrypoint
# ==================================================
on:
  workflow_call:

    # --------------------------------------------------
    # 🔐 Optional UI test credentials
    # That gives the reusable workflow the ability to
    # support UI in the future without forcing API
    # workflows to provide UI credentials
    #
    # Only UI-enabled workflows need these secrets.
    # API-only workflows can call this reusable workflow
    # without providing them.
    #
    # The credentials are supplied by the caller workflow
    # from GitHub Secrets and are used by the WooCommerce
    # environment setup to seed the dedicated UI customer.
    # --------------------------------------------------
    secrets:
      UI_CUSTOMER_USERNAME:
        required: false

      UI_CUSTOMER_EMAIL:
        required: false

      UI_CUSTOMER_PASSWORD:
        required: false

      UI_CUSTOMER_NO_ADDRESS_USERNAME:
        required: false

      UI_CUSTOMER_NO_ADDRESS_EMAIL:
        required: false

      UI_CUSTOMER_NO_ADDRESS_PASSWORD:
        required: false

      UI_CUSTOMER_PROFILE_USERNAME:
        required: false

      UI_CUSTOMER_PROFILE_EMAIL:
        required: false

      UI_CUSTOMER_PROFILE_PASSWORD:
        required: false

      UI_ADMIN_USERNAME:
        required: false

      UI_ADMIN_PASSWORD:
        required: false

    # --------------------------------------------------
    # 🔧 Inputs configurable by caller workflows
    # --------------------------------------------------
    inputs:
      suite_name:
        required: true
        type: string

      pytest_markers:
        required: true
        type: string

      timeout_minutes:
        required: false
        type: number
        default: 20

      pytest_durations:
        required: false
        type: number
        default: 10

      pytest_maxfail:
        required: false
        type: string # If not optional we set output to: number
        default: ""  # optional

      fail_on_empty:
        required: false
        type: boolean
        default: false

      pytest_extra_args:
        required: false
        type: string
        default: ""

      # --------------------------------------------------
      # Parallel pytest execution
      #
      # pytest-xdist[psutil] is installed through EcommerceAPI[dev].
      # "auto" selects the runner's available physical CPU count when
      # psutil is available, keeping local and CI worker selection aligned.
      # Individual workflows can override this for a constrained suite.
      # --------------------------------------------------
      pytest_workers:
        required: false
        type: string
        default: "auto"

      # --------------------------------------------------
      # Execution scope
      #
      # entity
      #   Executes once for each discovered framework
      #   entity (customers, orders, products...).
      #
      # shared
      #   Executes once for the entire framework.
      #
      # Used by:
      # - Unit
      # - Preflight
      # - Contract
      # - Security
      # --------------------------------------------------
      scope:
        required: false
        type: string
        default: entity

      entity:
        required: false
        type: string
        default: ""

      # --------------------------------------------------
      # Optional metadata propagated from the CI matrix.
      #
      # These inputs are not yet consumed by the reusable
      # workflow, but are exposed now so future workflows
      # (notifications, deployment gates, dashboards, etc.)
      # can reuse the same interface without breaking
      # existing callers.
      # --------------------------------------------------
      team:
        required: false
        type: string
        default: ""

      tier:
        required: false
        type: string
        default: ""

      browser:
        required: false
        type: string
        default: "chromium"

      install_playwright:
        required: false
        type: boolean
        default: false

      setup_woocommerce:
        required: false
        type: boolean
        default: true

      # --------------------------------------------------
      # UI environment setup
      #
      # Disabled by default so API-only workflows do not
      # require UI credentials or seed UI users.
      # --------------------------------------------------
      seed_ui_users:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ==================================================
  # 🧪 JOB — RUN TESTS + GENERATE ALLURE RESULTS
  # ==================================================

  # --------------------------------------------------
  # 🧪 Execute a single matrix entry
  #
  # The displayed job name uses the entity so GitHub
  # Actions remains readable as the number of
  # microservices grows.
  #
  # Example:
  #
  # Test • customers
  # Test • orders
  # --------------------------------------------------
  test:
    name: >-
      ${{ inputs.scope == 'shared'
          && format('Shared • {0}', inputs.suite_name)
          || format('Test • {0}', inputs.entity) }}

    runs-on: ubuntu-latest

    timeout-minutes: ${{ inputs.timeout_minutes }}

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --------------------------------------------------
      # 2. Setup Python project
      #
      # Shared composite action:
      # - setup-python
      # - pip caching
      # - editable install
      # - environment diagnostics
      # --------------------------------------------------
      - name: Setup Python project
        uses: ./.github/actions/setup-python-project

      # --------------------------------------------------
      # 3. Install Playwright browser
      # --------------------------------------------------
      - name: Install Playwright browser
        if: inputs.install_playwright
        shell: bash
        env:
          PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        run: |
          python -m playwright install --with-deps "$PLAYWRIGHT_BROWSER"

      # --------------------------------------------------
      # 🔍 Diagnostic — verify Playwright browser installation
      # --------------------------------------------------
      - name: Verify Playwright browser
        if: inputs.install_playwright
        shell: bash
        env:
          PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        run: |
          python -m playwright --version
          echo "Browser: $PLAYWRIGHT_BROWSER"
          python -m playwright install --dry-run "$PLAYWRIGHT_BROWSER"

      # --------------------------------------------------
      # 4. Setup WooCommerce environment
      # Optional:
      #
      # Some suites require a full Dockerized
      # WooCommerce stack.
      #
      # Examples:
      #
      # - smoke
      # - integration
      # - regression
      # - performance
      #
      # Other suites intentionally remain
      # lightweight and execute without Docker.
      #
      # Examples:
      #
      # - preflight
      #
      # This preserves fast developer feedback
      # while keeping infrastructure-heavy suites
      # fully reproducible.

      # What it does:
      # - Docker startup
      # - MySQL readiness
      # - WooCommerce bootstrap
      # - API credential extraction
      # - DB environment configuration
      # --------------------------------------------------
      - name: Setup WooCommerce environment
        if: inputs.setup_woocommerce
        uses: ./.github/actions/setup-woocommerce
        with:
          # UI user seeding is opt-in and enabled only by ui.yml.
          seed_ui_users: ${{ inputs.seed_ui_users }}

          # These values are received from the caller workflow's
          # GitHub Secrets. They are passed to the setup action
          # only when the UI suite explicitly provides them.
          #
          # This allows the setup action to seed the dedicated
          # UI customer before the tests run. The same credentials
          # are separately exposed to pytest below.
          #
          # All persistent UI customer profiles are passed to the setup
          # action so they can be provisioned before the Playwright suite.
          ui_customer_username: ${{ secrets.UI_CUSTOMER_USERNAME }}
          ui_customer_email: ${{ secrets.UI_CUSTOMER_EMAIL }}
          ui_customer_password: ${{ secrets.UI_CUSTOMER_PASSWORD }}

          ui_customer_no_address_username: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_USERNAME }}
          ui_customer_no_address_email: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_EMAIL }}
          ui_customer_no_address_password: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_PASSWORD }}

          ui_customer_profile_username: ${{ secrets.UI_CUSTOMER_PROFILE_USERNAME }}
          ui_customer_profile_email: ${{ secrets.UI_CUSTOMER_PROFILE_EMAIL }}
          ui_customer_profile_password: ${{ secrets.UI_CUSTOMER_PROFILE_PASSWORD }}

      # --------------------------------------------------
      # 5. Configure CI environment
      #
      # Shared composite action:
      # - runtime configuration
      # - logging behavior
      # - CI metadata
      # - environment flags
      # --------------------------------------------------
      - name: Configure CI environment
        id: configure_ci_env
        uses: ./.github/actions/configure-ci-env

      # --------------------------------------------------
      # 6. Determine pytest collection target
      #
      # Execution scope:
      #
      # entity
      #   Executes only the tests belonging to the
      #   selected API entity.
      #
      #   customers -> tests/customers
      #   orders    -> tests/orders
      #   products  -> tests/products
      #   coupons   -> tests/coupons
      #
      # shared
      #   Executes only framework-level tests.
      #
      #   shared -> tests/shared
      #
      # UI tests are intentionally excluded from Shared
      # Framework suites because they belong to the UI
      # execution workflow, even when they also carry
      # the "security" marker.
      # --------------------------------------------------
      - name: Determine test target
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.scope }}
          TEST_ENTITY: ${{ inputs.entity }}
        run: |
          set -euo pipefail

          if [[ "$TEST_SCOPE" != "shared" && "$TEST_SCOPE" != "entity" ]]; then
            echo "Unsupported test scope: $TEST_SCOPE"
            exit 1
          fi

          if [[ "$TEST_SCOPE" == "shared" ]]; then

            TARGET="tests/shared"

          elif [[ -n "$TEST_ENTITY" ]]; then

            if [[ ! "$TEST_ENTITY" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Invalid entity name: $TEST_ENTITY"
              exit 1
            fi

            TARGET="tests/$TEST_ENTITY"

          else

            TARGET="tests"

          fi

          echo "TEST_TARGET=$TARGET" >> "$GITHUB_ENV"

          echo "Selected test target:"
          echo "$TARGET"


      # --------------------------------------------------
      # 🔍 Diagnostic — verify UI credentials reach the job
      #
      # Never print the actual secret values.
      # This only confirms whether GitHub injected them.
      # --------------------------------------------------
      - name: Validate UI credentials
        if: inputs.suite_name == 'ui'
        shell: bash
        env:
          UI_CUSTOMER_USERNAME: ${{ secrets.UI_CUSTOMER_USERNAME }}
          UI_CUSTOMER_EMAIL: ${{ secrets.UI_CUSTOMER_EMAIL }}
          UI_CUSTOMER_PASSWORD: ${{ secrets.UI_CUSTOMER_PASSWORD }}
          UI_CUSTOMER_NO_ADDRESS_USERNAME: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_USERNAME }}
          UI_CUSTOMER_NO_ADDRESS_EMAIL: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_EMAIL }}
          UI_CUSTOMER_NO_ADDRESS_PASSWORD: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_PASSWORD }}
          UI_CUSTOMER_PROFILE_USERNAME: ${{ secrets.UI_CUSTOMER_PROFILE_USERNAME }}
          UI_CUSTOMER_PROFILE_EMAIL: ${{ secrets.UI_CUSTOMER_PROFILE_EMAIL }}
          UI_CUSTOMER_PROFILE_PASSWORD: ${{ secrets.UI_CUSTOMER_PROFILE_PASSWORD }}
          UI_ADMIN_USERNAME: ${{ secrets.UI_ADMIN_USERNAME }}
          UI_ADMIN_PASSWORD: ${{ secrets.UI_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "${UI_CUSTOMER_USERNAME:-}" ]] || {
            echo "❌ UI_CUSTOMER_USERNAME is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_EMAIL:-}" ]] || {
            echo "❌ UI_CUSTOMER_EMAIL is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_PASSWORD:-}" ]] || {
            echo "❌ UI_CUSTOMER_PASSWORD is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_NO_ADDRESS_USERNAME:-}" ]] || {
            echo "❌ UI_CUSTOMER_NO_ADDRESS_USERNAME is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_NO_ADDRESS_EMAIL:-}" ]] || {
            echo "❌ UI_CUSTOMER_NO_ADDRESS_EMAIL is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_NO_ADDRESS_PASSWORD:-}" ]] || {
            echo "❌ UI_CUSTOMER_NO_ADDRESS_PASSWORD is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_PROFILE_USERNAME:-}" ]] || {
            echo "❌ UI_CUSTOMER_PROFILE_USERNAME is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_PROFILE_EMAIL:-}" ]] || {
            echo "❌ UI_CUSTOMER_PROFILE_EMAIL is missing"
            exit 1
          }

          [[ -n "${UI_CUSTOMER_PROFILE_PASSWORD:-}" ]] || {
            echo "❌ UI_CUSTOMER_PROFILE_PASSWORD is missing"
            exit 1
          }

          [[ -n "${UI_ADMIN_USERNAME:-}" ]] || {
            echo "❌ UI_ADMIN_USERNAME is missing"
            exit 1
          }

          [[ -n "${UI_ADMIN_PASSWORD:-}" ]] || {
            echo "❌ UI_ADMIN_PASSWORD is missing"
            exit 1
          }

          echo "✅ UI customer profiles and admin credentials are available"



      # --------------------------------------------------
      # 7. Run pytest
      # Generates:
      # - Allure raw results
      # - JUnit XML
      # - structured logs
      #
      # Rationale:
      #
      # Pytest is the source of truth for test collection.
      #
      # We intentionally do NOT inspect the filesystem to determine whether tests exist.
      #
      # Reasons:
      #
      # - tests may be commented out
      # - tests may be deselected by markers
      # - tests may be skipped
      # - tests may be under development
      #
      # Pytest exit code semantics:
      #
      #   0 = tests executed successfully
      #   1 = test failures
      #   2+ = execution / infrastructure issues
      #   5 = no tests collected
      #
      # Empty collection behavior is configurable with `fail_on_empty`.
      #
      # Examples:
      #
      # - entity contains active tests
      # - entity tests are temporarily disabled
      # - marker filtering excludes all tests
      # - entity is under development
      #
      # By default, Exit Code 5 is treated as:
      #
      #   SUCCESS (Skipped Entity)
      #
      # `fail_on_empty: true` is used for required PR lanes and curated suites
      # where an empty marker selection would otherwise silently green the gate.
      # `fail_on_empty: false` keeps entity matrices usable while a domain is
      # still being adopted or has no tests in a particular optional suite.
      #
      # This preserves:
      # - matrix stability
      # - ownership visibility
      # - incremental team adoption

      # Supported scenarios:
      #
      # - Active smoke tests                -> Run
      # - Tests temporarily disabled        -> Skip
      # - Marker filtering excludes tests   -> Skip
      # - Entity under development          -> Skip
      # - No tests yet with fail_on_empty=false -> Skip
      # - No tests yet with fail_on_empty=true  -> Fail
      # - Test failures                     -> Fail
      # - Infrastructure failures           -> Fail
      # --------------------------------------------------
      - name: Run pytest
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.scope }}
          TEST_ENTITY: ${{ inputs.entity }}
          TEST_SUITE: ${{ inputs.suite_name }}
          PYTEST_MARKERS: ${{ inputs.pytest_markers }}
          PYTEST_BROWSER: ${{ inputs.browser }}
          PYTEST_WORKERS: ${{ inputs.pytest_workers }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest_extra_args }}
          PYTEST_DURATIONS: ${{ inputs.pytest_durations }}
          PYTEST_MAXFAIL: ${{ inputs.pytest_maxfail }}
          FAIL_ON_EMPTY: ${{ inputs.fail_on_empty }}
          # --------------------------------------------------
          # 🔐 UI test credentials
          #
          # These secrets are optional at the reusable-workflow
          # level because API-only workflows do not need them.
          #
          # UI tests, however, read these values directly from
          # the process environment via os.getenv(...).
          #
          # The credentials are therefore exposed only to the
          # pytest process and are not written to GITHUB_ENV.
          # --------------------------------------------------
          UI_CUSTOMER_USERNAME: ${{ secrets.UI_CUSTOMER_USERNAME }}
          UI_CUSTOMER_EMAIL: ${{ secrets.UI_CUSTOMER_EMAIL }}
          UI_CUSTOMER_PASSWORD: ${{ secrets.UI_CUSTOMER_PASSWORD }}
          UI_CUSTOMER_NO_ADDRESS_USERNAME: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_USERNAME }}
          UI_CUSTOMER_NO_ADDRESS_PASSWORD: ${{ secrets.UI_CUSTOMER_NO_ADDRESS_PASSWORD }}
          UI_CUSTOMER_PROFILE_USERNAME: ${{ secrets.UI_CUSTOMER_PROFILE_USERNAME }}
          UI_CUSTOMER_PROFILE_PASSWORD: ${{ secrets.UI_CUSTOMER_PROFILE_PASSWORD }}
          UI_ADMIN_USERNAME: ${{ secrets.UI_ADMIN_USERNAME }}
          UI_ADMIN_PASSWORD: ${{ secrets.UI_ADMIN_PASSWORD }}

        run: |

          # ----------------------------------------------
          # Allow pytest to return non-zero exit codes
          # so we can evaluate them explicitly.
          # ----------------------------------------------
          set -uo pipefail

          if [[ "$PYTEST_BROWSER" != "chromium" && "$PYTEST_BROWSER" != "firefox" && "$PYTEST_BROWSER" != "webkit" ]]; then
            echo "Unsupported Playwright browser: $PYTEST_BROWSER"
            exit 1
          fi

          if [[ ! "$PYTEST_WORKERS" =~ ^(auto|[0-9]+)$ ]]; then
            echo "pytest_workers must be 'auto' or an integer."
            exit 1
          fi

          if [[ ! "$PYTEST_DURATIONS" =~ ^[0-9]+$ ]]; then
            echo "pytest_durations must be a non-negative integer."
            exit 1
          fi

          PYTEST_EXTRA_ARGS_ARRAY=()
          if [[ -n "$PYTEST_EXTRA_ARGS" ]]; then
            read -r -a PYTEST_EXTRA_ARGS_ARRAY <<< "$PYTEST_EXTRA_ARGS"
          fi

          PYTEST_MAXFAIL_ARGS=()
          if [[ -n "$PYTEST_MAXFAIL" ]]; then
            if [[ ! "$PYTEST_MAXFAIL" =~ ^[1-9][0-9]*$ ]]; then
              echo "pytest_maxfail must be a positive integer when set."
              exit 1
            fi
            PYTEST_MAXFAIL_ARGS+=("--maxfail=$PYTEST_MAXFAIL")
          fi

          # Playwright traces are enabled only for the standalone UI suite.
          # API and shared test jobs keep using their existing diagnostics.
          PYTEST_TRACE_ARGS=()
          if [[ "$TEST_SUITE" == "ui" ]]; then
            PYTEST_TRACE_ARGS+=(--tracing retain-on-failure --output reports/playwright)
          fi

          python -m pytest "$TEST_TARGET" \
            -m "$PYTEST_MARKERS" \
            --browser "$PYTEST_BROWSER" \
            -n "$PYTEST_WORKERS" \
            "${PYTEST_TRACE_ARGS[@]}" \
            -ra \
            "${PYTEST_EXTRA_ARGS_ARRAY[@]}" \
            --durations="$PYTEST_DURATIONS" \
            "${PYTEST_MAXFAIL_ARGS[@]}" \
            --clean-alluredir \
            --junitxml=reports/junit/results.xml \
            --alluredir=reports/allure-results

          PYTEST_EXIT_CODE=$?

          # Restore strict mode
          set -e

          # ----------------------------------------------
          # Exit Code 5 = No tests collected
          #
          # Treat as successful skipped entity.
          # ----------------------------------------------
          if [ "$PYTEST_EXIT_CODE" -eq 5 ]; then

            if [[ "$FAIL_ON_EMPTY" == "true" ]]; then
              echo "No eligible tests were collected, but this suite requires at least one test."
              exit 1
            fi

            echo "No eligible tests collected."
            echo "Entity: $TEST_ENTITY"
            echo "Result: SKIPPED"

            # ----------------------------------------------
            # Publish execution summary to GitHub Actions
            #
            # This provides visibility that the entity was
            # intentionally skipped rather than silently
            # succeeding.
            # ----------------------------------------------
            echo "## Execution Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$TEST_SCOPE" == "shared" ]]; then
              echo "- Scope: Shared Framework" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Entity: $TEST_ENTITY" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "- Status: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: No eligible tests collected" >> "$GITHUB_STEP_SUMMARY"

            exit 0

          fi

          if [ "$PYTEST_EXIT_CODE" -eq 0 ]; then

            echo "## Execution Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TEST_SCOPE" == "shared" ]]; then
              echo "- Scope: Shared Framework" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Entity: $TEST_ENTITY" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- Status: EXECUTED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: SUCCESS" >> "$GITHUB_STEP_SUMMARY"

          fi

          exit "$PYTEST_EXIT_CODE"


      # --------------------------------------------------
      # 9. Publish Allure results artifact
      # --------------------------------------------------
      # Each matrix entry publishes an independent artifact.
      #
      # API entity suites:
      #   customers-smoke-allure-results
      #   products-integration-allure-results
      #
      # UI browser matrix:
      #   ui-chromium-allure-results
      #   ui-firefox-allure-results
      #   ui-webkit-allure-results
      #
      # Browser must be part of the UI artifact name because
      # chromium, firefox and webkit execute as separate
      # GitHub Actions matrix jobs.
      # --------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.scope == 'shared'
            && format('shared-{0}-allure-results', inputs.suite_name)
            || inputs.suite_name == 'ui'
            && format('ui-{0}-allure-results', inputs.browser)
            || format('{0}-{1}-allure-results', inputs.entity, inputs.suite_name) }}
          path: reports/allure-results
          if-no-files-found: ignore
          retention-days: 14

      # --------------------------------------------------
      # 10. Publish structured logs artifact
      # --------------------------------------------------
      - name: Publish structured logs artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.scope == 'shared'
            && format('shared-{0}-structured-logs', inputs.suite_name)
            || inputs.suite_name == 'ui'
            && format('ui-{0}-structured-logs', inputs.browser)
            || format('{0}-{1}-structured-logs', inputs.entity, inputs.suite_name) }}
          path: reports/logs
          if-no-files-found: ignore
          retention-days: 14

      # --------------------------------------------------
      # 11. Publish JUnit artifact
      # --------------------------------------------------
      - name: Publish JUnit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.scope == 'shared'
            && format('shared-{0}-junit-results', inputs.suite_name)
            || inputs.suite_name == 'ui'
            && format('ui-{0}-junit-results', inputs.browser)
            || format('{0}-{1}-junit-results', inputs.entity, inputs.suite_name) }}
          path: reports/junit/results.xml
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 12. Publish failure-only Playwright traces
      # --------------------------------------------------
      # This opt-in may publish traces publicly when the
      # repository is public. Enable only when trace content
      # is safe for public access. Passing tests leave no files.
      - name: Upload Playwright traces
        if: >-
          always() && inputs.suite_name == 'ui' &&
          steps.configure_ci_env.outputs.playwright_trace_artifact_enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ inputs.browser }}-playwright-traces
          path: reports/playwright/
          if-no-files-found: ignore
          retention-days: 7

      # --------------------------------------------------
      # 13. Cleanup Docker environment
      #
      # Shared composite action:
      # - stop containers
      # - remove networks
      # - remove anonymous volumes
      # --------------------------------------------------
      - name: Cleanup Docker environment
        if: always() && inputs.setup_woocommerce
        uses: ./.github/actions/docker-cleanup
