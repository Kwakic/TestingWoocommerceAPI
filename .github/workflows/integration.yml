
name: Integration Tests 🔗

# ==================================================
# Controls:
# - orchestration
# - dependencies
# - permissions
# - triggers
# - concurrency
#
# The philosophy:
# Integration tests validate API + database consistency
# independently for every discovered entity. PRs run only the curated
# `pr` slice; pushes to main and manual runs execute the full integration set.
#
# Each entity runs in isolated matrix jobs:
# - customers
# - orders
# - products
# - coupons
#
# This preserves:
# - ownership boundaries
# - failure isolation
# - independent diagnostics
# - future scalability
# ==================================================


# ==================================================
# 🔁 Triggers
# ==================================================
on:

  # Run on pull requests targeting main branch
  # ==================================================
  pull_request:
    branches: [ main ]


  # Run on pushes to main branch
  #
  # Integration suite acts as:
  # - API + database validation
  # - End-to-end consistency verification
  # - Operational confidence signal
  # ==================================================
  push:
    branches: [ main ]


  # ==================================================
  # Allow manual execution from GitHub UI
  # ==================================================
  workflow_dispatch:


permissions:
  contents: read

jobs:

  # ==================================================
  # 🔍 JOB 1 — DISCOVER FRAMEWORK ENTITIES
  # ==================================================
  #
  # The framework is the Single Source of Truth.
  #
  # CI never maintains a hardcoded entity list.
  #
  # The discovery script delegates to EcommerceAPI.src.metadata.entity_metadata.discover_framework_entities()
  #
  # The generated matrix includes metadata (entity, team, tier) used by all downstream jobs.
  # ==================================================
  discover-entities:

    name: Discover framework entities

    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install framework
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e "./EcommerceAPI[dev]"

      # ==================================================
      # Build GitHub Actions matrix
      # ==================================================
      #
      # The framework is the Single Source of Truth for entity discovery.
      #
      # The CI simply asks the framework which entities
      # are fully implemented and converts the result into
      # a GitHub Actions matrix.
      # ==================================================
      - id: discovery
        name: Build entity matrix
        shell: bash
        run: |
          MATRIX=$(python .github/scripts/generate_matrix.py)

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Framework entities discovered"
          echo "$MATRIX"
  # ==================================================
  # 🧪 JOB 2 — EXECUTE INTEGRATION TESTS
  #
  # Matrix strategy:
  # One isolated job per entity/team.
  #
  # The rationale:
  # - independent ownership
  # - isolated failures
  # - parallel execution
  # - scalable architecture
  #
  # Delegates all shared CI logic to the reusable test runner workflow.
  #
  # Shared responsibilities extracted:
  # - checkout
  # - python setup
  # - dependency install
  # - docker startup
  # - MySQL readiness
  # - WooCommerce bootstrap
  # - env configuration
  # - pytest execution
  # - artifact uploads
  # - docker cleanup
  # ==================================================

  test:

    needs: discover-entities

    # ==================================================
    # Matrix execution
    # ==================================================
    #
    # Each entity represents:
    # - ownership boundary
    # - deployment boundary
    # - reporting boundary
    #
    # IMPORTANT:
    # One entity failure must NOT cancel others.
    #
    # Example:
    # customers failure must NOT cancel:
    # - orders
    # - products
    # - coupons
    #
    # This preserves full diagnostic visibility.
    # ==================================================
    strategy:

      fail-fast: false

      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}

    # ==================================================
    # Execute the Integration suite for every discovered
    # entity using the shared test runner.
    #
    # Entity discovery remains framework-owned.
    # GitHub Actions only consumes the generated matrix.
    # ==================================================

    uses: ./.github/workflows/reusable-test-runner.yml

    with:

      # ==================================================
      # Test suite metadata
      # ==================================================
      suite_name: integration
      pytest_markers: ${{ github.event_name == 'pull_request' && 'integration and pr and not smoke' || 'integration' }}
      fail_on_empty: ${{ github.event_name == 'pull_request' }}

      # ==================================================
      # Pytest runtime configuration
      # ==================================================
      timeout_minutes: 25
      pytest_durations: 20
      pytest_maxfail: 5
      pytest_extra_args: "-v"

      # ==================================================
      # Entity ownership boundary
      #
      # Entity == Team == Microservice
      #
      # Examples:
      # - customers
      # - orders
      # - products
      # - coupons
      #
      # Passed to reusable-test-runner.yml
      # for:
      # - entity-specific test execution
      # - entity-specific reporting
      # - entity-specific artifacts
      # - ownership isolation
      # ==================================================
      entity: ${{ matrix.entity }}
      # Reserved for future features.
      # The reusable workflows currently ignore
      # these values, but exposing them now keeps
      # every workflow interface consistent.
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}

  # ==================================================
  # 🚦 JOB 3 — INTEGRATION QUALITY GATE
  # ==================================================
  #
  # Aggregates the result of all entity matrix jobs.
  #
  # This is the stable PR status check.
  #
  # Branch protection should require:
  #   Integration Quality Gate
  #
  # It should NOT require individual entity jobs.

  # GitHub branch protection only cares about Integration Quality Gate, not the individual entities.
  # So you'll get for Integration Tests
  # ├── Test • customers
  # ├── Test • orders
  # ├── Test • products
  # ├── Test • coupons
  # │
  # └── Integration Quality Gate
  # ==================================================
  integration-gate:

    name: Integration Quality Gate

    needs:
      - test

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:

      - name: Validate integration results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Integration tests failed."
            exit 1
          fi

          echo "Integration tests passed."


  # ==================================================
  # 📊 JOB 4 — GENERATE + PUBLISH ALLURE REPORT
  # ==================================================
  # Generates and publishes one Allure report
  # per discovered entity.
  #
  # Report publication remains independent from
  # test execution to preserve failure visibility.
  publish-report:

    needs:
      - discover-entities
      - test

    if: always() && needs.discover-entities.result == 'success'

    strategy:

      fail-fast: false

      matrix: ${{ fromJson(needs.discover-entities.outputs.matrix) }}

#    concurrency:
#      group: pages-deploy-${{ matrix.entity }}
#      cancel-in-progress: false

    permissions:

      contents: read

    uses: ./.github/workflows/reusable-allure-report.yml

    with:
      suite_name: integration
      report_timeout_minutes: 10
      entity: ${{ matrix.entity }}
      # Reserved for future features.
      # The reusable workflows currently ignore these values, but exposing them now keeps
      # every workflow interface consistent.
      team: ${{ matrix.team }}
      tier: ${{ matrix.tier }}
