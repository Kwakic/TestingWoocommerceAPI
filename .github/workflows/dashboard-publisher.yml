      # The portal itself is generated dynamically from the
      # reports currently present inside the site directory.
      #
      # Example
      # -------
      #
      # downloaded-reports/
      # ├── customers-smoke-report
      # ├── customers-regression-report
      # └── products-smoke-report
      #
      #              │
      #              ▼
      #
      # site/
      # ├── customers/
      # │   ├── smoke/
      # │   └── regression/
      # ├── products/
      # │   └── smoke/
      # ├── style.css
      # └── index.html   ← generated by generate_portal.py
      # --------------------------------------------------


name: Deploy GitHub Pages 🚀

# ==================================================
# GitHub Pages Publisher
#
# Design principle:
#
# Test execution and report publication are
# intentionally separated.
#
# Test workflows:
#   • execute tests
#   • generate Allure HTML
#   • upload report artifacts
#
# This workflow:
#   • downloads report artifacts
#   • rebuilds the QA Portal
#   • publishes GitHub Pages
#
# GitHub Pages allows only one deployment at a time.
# The publisher uses a concurrency group so deployment
# requests are handled one at a time instead of racing.
# ==================================================

# ==================================================
# Purpose
#
# Single responsibility:
#
# Assemble every generated Allure report into a
# single GitHub Pages website.
#
# No tests are executed here.
#
# This workflow only consumes artifacts produced
# by the individual test suites.
# ==================================================
#
# Workflow:
#
#Restore gh-pages
#↓
#Download every Allure artifact
#↓
#Copy reports into site/
#↓
#Copy style.css into site/
#↓
#Generate index.html
#    python .github/portal/generate_portal.py
#↓


#Deploy site/
# ==================================================

# ==================================================
# Trigger
#
# The workflow is started automatically whenever a
# report-producing workflow completes.
#
# A manual trigger is also available to republish an
# existing report run by its workflow run ID.
# ==================================================

on:

  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run ID containing the reports to republish
        required: true
        type: number

  workflow_run:

    workflows:
      - Smoke Tests 🔥
      - Integration Tests 🔗
      - Regression Tests 🔬
      - Performance Tests ⏱️
      - UI Tests 🎭

    types:
      - completed

# Every job starts with no token permissions. Each job grants only the
# permissions it needs below.
permissions: {}

jobs:

  # Validate the source run before any privileged job downloads its files.
  # workflow_run grants this workflow access to write credentials even though
  # the completed test workflow may have been triggered by less-trusted code.
  validate-source-run:
    name: Validate report source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.validate.outputs.run_id }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: Validate source workflow run
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "A numeric source_run_id is required."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Manual report publishing must run from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          run_json=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          head_branch=$(jq -r '.head_branch // ""' <<< "$run_json")
          head_repository=$(jq -r '.head_repository.full_name // ""' <<< "$run_json")
          source_event=$(jq -r '.event // ""' <<< "$run_json")
          source_name=$(jq -r '.name // ""' <<< "$run_json")
          head_sha=$(jq -r '.head_sha // ""' <<< "$run_json")

          if [[ "$head_branch" != "$DEFAULT_BRANCH" || "$head_repository" != "$REPOSITORY" ]]; then
            echo "Reports may only be published from runs on this repository's default branch."
            exit 1
          fi

          case "$source_event" in
            push|schedule|workflow_dispatch) ;;
            *) echo "Source event '$source_event' is not approved for report publishing."; exit 1 ;;
          esac

          case "$source_name" in
            "Smoke Tests 🔥"|"Integration Tests 🔗"|"Regression Tests 🔬"|"Performance Tests ⏱️"|"UI Tests 🎭") ;;
            *) echo "Workflow '$source_name' does not produce publishable reports."; exit 1 ;;
          esac

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source workflow returned an invalid commit SHA."
            exit 1
          fi

          echo "run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  deploy-dashboard:

    needs: validate-source-run

    permissions:
      contents: write
      actions: read

    timeout-minutes: 15

    env:
      REPORTS_DIR: ${{ runner.temp }}/downloaded-reports

    concurrency:

      # --------------------------------------------------
      # GitHub Pages deployment queue
      #
      # GitHub Pages accepts only one deployment at a time.
      #
      # Queue deployment requests instead of cancelling
      # them when multiple workflows finish together.
      # --------------------------------------------------
      group: github-pages-publisher

      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --------------------------------------------------
      # Checkout the currently published GitHub Pages site.
      #
      # The existing website becomes the base for the new
      # deployment so that previously published reports are
      # preserved.
      #
      # The existing GitHub Pages site becomes the base for the new deployment.
      #
      # Only reports produced by the triggering workflow
      # are overwritten. All previously published reports remain available.
      # --------------------------------------------------
      - name: Checkout GitHub Pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # --------------------------------------------------
      # Download every generated HTML report.
      #
      # Artifact names follow the convention:
      #
      #   report-customers-smoke
      #   report-orders-smoke
      #   report-products-regression
      #   report-ui
      #
      # The `report-*` glob matches every entity report
      # and the standalone UI report.
      # --------------------------------------------------


      - name: Download report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-source-run.outputs.run_id }}
          pattern: report-*
          path: ${{ runner.temp }}/downloaded-reports




      # --------------------------------------------------
      # Verify downloaded artifacts
      # --------------------------------------------------
      #
      # Fail early if no reports were found.
      # This usually indicates that the triggering workflow
      # did not publish any report artifacts.
      # --------------------------------------------------

      - name: Verify downloaded artifacts
        shell: bash
        run: |

          echo "Downloaded artifacts"

          find "$REPORTS_DIR" || true

          if [ ! -d "$REPORTS_DIR" ]; then
            echo "No report artifacts found."
            exit 1
          fi

      # --------------------------------------------------
      # Build GitHub Pages website
      #
      # This is the heart of the deployment workflow.
      #
      # Responsibilities:
      #
      # 1. Copy the QA Portal.
      # 2. Discover every downloaded report artifact.
      # 3. Extract entity and suite names from the artifact.
      # 4. Rebuild the GitHub Pages directory structure.
      #
      # # Reports are discovered dynamically from the downloaded artifacts.
      #
      # Example:
      #
      # report-customers-smoke
      #           │
      #           ▼
      # site/customers/smoke
      #
      # report-orders-regression
      #           │
      #           ▼
      # site/orders/regression
      #
      # --------------------------------------------------

      - name: Build website
        shell: bash
        run: |

          # --------------------------------------------------
          # Start from the previously published website.
          #
          # This preserves every existing report while allowing
          # the current workflow to overwrite only the reports
          # it has just generated.
          #
          # First deployment:
          #   gh-pages may not exist yet.
          # --------------------------------------------------

          if [ -d gh-pages ]; then
              echo "Restoring existing GitHub Pages website..."
              mkdir -p site
              # Copy the previously published website while excluding
              # the Git metadata from the checked-out gh-pages branch.
              tar \
                --exclude='.git' \
                -cf - \
                -C gh-pages . \
              | tar -xf - -C site
          else
              echo "First deployment. Creating new website..."
              mkdir -p site
          fi

          echo
          echo "===== Downloaded artifacts ====="
          find "$REPORTS_DIR"

          echo
          echo "===== Building website ====="

          for artifact in "$REPORTS_DIR"/report-*; do

            [ -d "$artifact" ] || continue

            artifact_name=$(basename "$artifact")

            # --------------------------------------------------
            # Standalone UI report
            #
            # UI is not an API entity, so it does not use the
            # existing <entity>-<suite>-report convention.
            #
            # report-ui
            #     ↓
            # site/ui/
            # --------------------------------------------------
            if [ "$artifact_name" = "report-ui" ]; then

              echo "Publishing UI / Playwright"

              mkdir -p "site/ui"

              cp -R "$artifact"/. "site/ui"

              continue

            fi

            # --------------------------------------------------
            # Existing entity report handling
            #
            # Keep the existing dynamic entity/suite discovery.
            #
            # customers-smoke-report
            #        ↓
            # customers-smoke
            #        ↓
            # site/customers/smoke
            # --------------------------------------------------

            name="${artifact_name#report-}"

            # Extract the entity name.
            entity="${name%-*}"

            # Extract the test suite.
            suite="${name##*-}"

            echo "Publishing $entity / $suite"

            mkdir -p "site/$entity/$suite"

            cp -R "$artifact"/. "site/$entity/$suite"

          done

          # --------------------------------------------------
          # Generate the QA Portal.
          #
          # The landing page is rebuilt from the reports that
          # are currently published inside the site directory.
          #
          # No HTML template is stored in the repository.
          # --------------------------------------------------

          echo
          echo "===== Generating QA Portal ====="

          python .github/portal/generate_portal.py

          echo
          echo "===== Final site ====="

          find site

          echo
          echo "===== Portal ====="
          ls -R site

          echo
          echo
          echo "===== Published entities ====="
          find site -maxdepth 2 -type d | sort

          echo
          echo "===== HTML ====="
          find site -name index.html

      # --------------------------------------------------
      # Optional diagnostic output.
      #
      # Helps troubleshoot GitHub Pages publication when
      # investigating CI failures.
      # --------------------------------------------------

      - name: Debug generated website
        shell: bash
        run: |
          echo "=========================================="
          echo " GitHub Pages Website"
          echo "=========================================="

          pwd

          echo
          echo "Generated site:"
          find site | sort

          echo
          echo "Downloaded report artifacts:"
          find "$REPORTS_DIR" | sort

      # --------------------------------------------------
      # Publish website
      # --------------------------------------------------

      # --------------------------------------------------
      # Publish the rebuilt QA Portal to GitHub Pages.
      #
      # The complete website (portal + all preserved
      # Allure reports) is deployed from the generated
      # `site/` directory.
      #
      # Existing reports remain available because the
      # workflow first restores the previous GitHub Pages
      # site and then updates only the reports generated
      # by the current workflow run.
      # --------------------------------------------------
      - name: Create deployment metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-source-run.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ needs.validate-source-run.outputs.run_id }}
        run: |
          cat > site/build.json <<EOF
          {
            "framework": "TestEcommerceAPI",
            "commit": "$SOURCE_SHA",
            "workflow": "Deploy GitHub Pages 🚀",
            "source_run_id": "$SOURCE_RUN_ID",
            "published_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          echo "Deployment metadata:"
          cat site/build.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false
