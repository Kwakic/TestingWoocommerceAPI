name: Setup WooCommerce Environment

description: >
  Starts the Docker-based WooCommerce stack,
  waits for MySQL readiness, bootstraps WooCommerce,
  captures dynamic API credentials, and configures
  database environment variables for CI execution.

runs:
  using: composite

  steps:

    # --------------------------------------------------
    # 1. Start Docker environment
    #
    # Launches:
    # - WordPress
    # - MySQL
    # - WooCommerce stack
    # --------------------------------------------------
    - name: Start Docker stack
      shell: bash
      run: |
        set -e

        MAX_ATTEMPTS=3
        RETRY_DELAY=30

        for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
          echo "Docker compose attempt $ATTEMPT/$MAX_ATTEMPTS"

          if docker compose -f docker-compose.wp.yml up -d; then
            echo "✅ Docker stack started"
            exit 0
          fi

          echo "❌ Attempt failed"

          docker compose -f docker-compose.wp.yml ps || true

          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "Retrying in $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          fi
        done

        echo "❌ Docker compose failed after $MAX_ATTEMPTS attempts"
        exit 1

    # --------------------------------------------------
    # 2. Wait for MySQL readiness
    #
    # Prevents race conditions during bootstrap.
    # CI runners can be inconsistent in startup timing,
    # so we explicitly wait until MySQL accepts
    # TCP connections.
    # --------------------------------------------------
    - name: Wait for MySQL
      shell: bash
      run: |
        until nc -z 127.0.0.1 3306; do
          echo "Waiting for MySQL..."
          sleep 3
        done

        echo "✅ MySQL is ready"

    # --------------------------------------------------
    # 3. Bootstrap WooCommerce (with retries)
    #
    # Executes scripts/setup.sh in a retry loop to tolerate
    # transient CI/network failures (e.g. WordPress downloads).
    #
    # Key behavior:
    # - Retries the full bootstrap up to N attempts
    # - Captures stdout (credentials) separately from stderr (logs)
    # - Prints stderr tail on failure for fast debugging
    #
    # Contract with setup.sh:
    # - setup.sh prints WC_KEY
    # - setup.sh prints WC_SECRET
    # - setup.sh prints WP_ADMIN_APP_PASSWORD
    # - all logs (progress, WP-CLI, curl, etc.) go to stderr
    #
    # CI responsibility:
    # - Validates that both WC_KEY and WC_SECRET exist
    # - Writes them directly into $GITHUB_ENV
    # - Never touches a .env file
    #
    # This preserves a clean separation:
    # - setup.sh = environment bootstrap (pure, reusable)
    # - CI        = orchestration, retries, observability
    #
    # - Fails only after all retry attempts are exhausted
    # --------------------------------------------------
    - name: Bootstrap WooCommerce and capture credentials (with retries)
      shell: bash
      run: |
        set -euo pipefail

        MAX_ATTEMPTS=3
        RETRY_DELAY=20

        for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
          echo "Bootstrap attempt $ATTEMPT/$MAX_ATTEMPTS"

          set +e
          TMP_ERR=$(mktemp)
          TMP_OUT=$(mktemp)

          bash scripts/setup.sh >"$TMP_OUT" 2>"$TMP_ERR"
          RC=$?

          set -e

          CREDENTIALS=$(tr -d '\r' < "$TMP_OUT")

          if [ $RC -eq 0 ] && \
             grep -q '^WC_KEY=' <<< "$CREDENTIALS" && \
             grep -q '^WC_SECRET=' <<< "$CREDENTIALS" && \
             grep -q '^WP_ADMIN_APP_PASSWORD=' <<< "$CREDENTIALS"; then

            echo "$CREDENTIALS" >> "$GITHUB_ENV"
            echo "✅ Fresh WooCommerce and GraphQL credentials generated"

            rm -f "$TMP_ERR" "$TMP_OUT"
            exit 0
          fi

          echo "❌ setup.sh failed (attempt $ATTEMPT/$MAX_ATTEMPTS). RC=$RC"

          echo "----- Tail of setup.sh stderr -----"
          tail -n 200 "$TMP_ERR" || true
          echo "-----------------------------------"

          rm -f "$TMP_ERR" "$TMP_OUT"

          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "Retrying in $RETRY_DELAY seconds..."
            sleep $RETRY_DELAY
          fi
        done

        echo "❌ WooCommerce bootstrap failed after $MAX_ATTEMPTS attempts"

        docker compose -f docker-compose.wp.yml logs wordpress || true
        docker compose -f docker-compose.wp.yml logs db || true

        exit 1

    # --------------------------------------------------
    # 4. Configure WordPress / GraphQL credentials
    #
    # WP_ADMIN_USER is static configuration.
    # WP_ADMIN_APP_PASSWORD is generated by setup.sh
    # and was already written to $GITHUB_ENV above.
    # --------------------------------------------------
    - name: Configure WordPress credentials
      shell: bash
      run: |
        echo "WP_ADMIN_USER=admin" >> "$GITHUB_ENV"

        echo "✅ WordPress / GraphQL credentials configured"


    # --------------------------------------------------
    # 5. Configure database connection
    #
    # Must match docker-compose configuration.
    #
    # These variables are consumed by:
    # - DAOs
    # - SQLAlchemy
    # - DB validators
    # - integration helpers
    # --------------------------------------------------
    - name: Configure DB connection
      shell: bash
      run: |
        echo "DB_USER=wp" >> $GITHUB_ENV
        echo "DB_PASSWORD=wp" >> $GITHUB_ENV
        echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DB_PORT=3306" >> $GITHUB_ENV
        echo "DB_DATABASE=wordpress" >> $GITHUB_ENV
        echo "DB_TABLE_PREFIX=wp_" >> $GITHUB_ENV

        echo "✅ Database environment configured"

    # --------------------------------------------------
    # 6. Print Docker diagnostics
    #
    # Extremely valuable for CI debugging:
    # - failed container startup
    # - unhealthy services
    # - port collisions
    # - unexpected exits
    # --------------------------------------------------
    - name: Print Docker diagnostics
      shell: bash
      run: |
        echo "====================================="
        echo "Docker containers:"
        docker ps -a

        echo "====================================="
